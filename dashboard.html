<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAMs Daily Closing Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .date {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .stat-subtitle {
            font-size: 0.9em;
            color: #999;
        }

        .budget-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }

        .budget-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
        }

        .status.on-track {
            background: #d4f4dd;
            color: #22863a;
        }

        .status.over-budget {
            background: #ffeef0;
            color: #cb2431;
        }

        .status.warning {
            background: #fff8c5;
            color: #9e6a03;
        }

        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        .chart-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        canvas {
            position: relative;
            max-height: 300px;
        }

        .breakdown {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .breakdown-item {
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .breakdown-label {
            color: #666;
            font-size: 0.85em;
        }

        .breakdown-value {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #ffeef0;
            color: #cb2431;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #cb2431;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .charts {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .stat-value {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 BAMs Daily Closing</h1>
            <p class="date" id="current-date"></p>
        </header>

        <div id="content">
            <div class="loading">⏳ Loading data...</div>
        </div>
    </div>

    <script>
        // This is a template dashboard with placeholder data
        // Once connected to Google Sheets, this data will pull live from your sheet

        // Placeholder data structure (will be replaced with real data from your sheet)
        const sampleData = {
            date: new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
            totalSales: 0,
            dailyBudget: 3200,
            cashIn: 0,
            cardIn: 0,
            discounts: 0,
            refunds: 0,
            voids: 0,
            variance: 0, // cash_out - cash_in
            payments: {
                cash: 0,
                card: 0,
                other: 0
            }
        };

        function initDashboard() {
            document.getElementById('current-date').textContent = sampleData.date;

            const budgetPercent = (sampleData.totalSales / sampleData.dailyBudget) * 100;
            const budgetStatus = budgetPercent >= 85 ? 'on-track' : budgetPercent >= 70 ? 'warning' : 'over-budget';
            const budgetText = budgetPercent >= 100 ? 'Over Budget!' : `${Math.round(budgetPercent)}% of Target`;

            const html = `
                <div class="grid">
                    <div class="card stat-card">
                        <div class="stat-label">Total Sales</div>
                        <div class="stat-value">$${sampleData.totalSales.toFixed(2)}</div>
                        <div class="stat-subtitle">Today's Revenue</div>
                        <div class="budget-bar">
                            <div class="budget-fill" style="width: ${Math.min(budgetPercent, 100)}%"></div>
                        </div>
                        <span class="status ${budgetStatus}">${budgetText}</span>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-label">Daily Budget</div>
                        <div class="stat-value">$${sampleData.dailyBudget.toFixed(2)}</div>
                        <div class="stat-subtitle">Target for Today</div>
                        ${sampleData.totalSales > sampleData.dailyBudget ?
                            `<span class="status on-track">✓ Goal Achieved</span>` :
                            `<span class="status warning">$${(sampleData.dailyBudget - sampleData.totalSales).toFixed(2)} Remaining</span>`}
                    </div>

                    <div class="card stat-card">
                        <div class="stat-label">Cash Variance</div>
                        <div class="stat-value" style="color: ${sampleData.variance >= 0 ? '#22863a' : '#cb2431'}">
                            ${sampleData.variance >= 0 ? '+' : ''}$${sampleData.variance.toFixed(2)}
                        </div>
                        <div class="stat-subtitle">Cash Out - Cash In</div>
                    </div>
                </div>

                <div class="charts">
                    <div class="chart-container">
                        <div class="chart-title">Payment Breakdown</div>
                        <canvas id="paymentChart"></canvas>
                    </div>

                    <div class="chart-container">
                        <div class="chart-title">Deductions</div>
                        <div class="breakdown">
                            <div class="breakdown-item">
                                <div class="breakdown-label">Discounts</div>
                                <div class="breakdown-value">$${sampleData.discounts.toFixed(2)}</div>
                            </div>
                            <div class="breakdown-item">
                                <div class="breakdown-label">Refunds</div>
                                <div class="breakdown-value">$${sampleData.refunds.toFixed(2)}</div>
                            </div>
                            <div class="breakdown-item">
                                <div class="breakdown-label">Voids</div>
                                <div class="breakdown-value">$${sampleData.voids.toFixed(2)}</div>
                            </div>
                            <div class="breakdown-item">
                                <div class="breakdown-label">Total Deductions</div>
                                <div class="breakdown-value">$${(sampleData.discounts + sampleData.refunds + sampleData.voids).toFixed(2)}</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 30px;">
                    <button class="refresh-btn" onclick="location.reload()">↻ Refresh Data</button>
                </div>
            `;

            document.getElementById('content').innerHTML = html;

            // Payment chart
            const ctx = document.getElementById('paymentChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Cash', 'Card', 'Other'],
                    datasets: [{
                        data: [
                            sampleData.payments.cash,
                            sampleData.payments.card,
                            sampleData.payments.other
                        ],
                        backgroundColor: [
                            '#667eea',
                            '#764ba2',
                            '#f093fb'
                        ],
                        borderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Initialize on load
        window.addEventListener('load', initDashboard);
    </script>
</body>
</html>
