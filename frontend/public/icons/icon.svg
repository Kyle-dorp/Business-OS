      <stop offset="0%" stop-color="#F5A65B" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#D9788D" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#0E0B0C" stop-opacity="0"/>
