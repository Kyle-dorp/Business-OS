<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — Business-EOS</title>
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    display:grid;place-items:center;
    padding:2rem;
    background:
      radial-gradient(60vw 50vw at 20% -10%, rgba(245,166,91,.10), transparent 62%),
      radial-gradient(55vw 45vw at 95% 10%, rgba(217,120,141,.08), transparent 64%),
      #0E0B0C;
    color:#F6F0EA;
    font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-weight:300;line-height:1.7;text-align:center;
  }
  .card{max-width:30rem}
  .dot{
    width:.6rem;height:.6rem;border-radius:50%;background:#F5A65B;
    box-shadow:0 0 14px 2px rgba(245,166,91,.45);
    margin:0 auto 2rem;
  }
  h1{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;margin:0 0 .75rem}
  p{margin:0 0 1.75rem;color:#C6B9B1}
  button{
    font:inherit;font-weight:600;color:#FFC98F;
    background:rgba(245,166,91,.09);
    border:1px solid rgba(245,166,91,.2);
    border-radius:10px;padding:.75rem 1.4rem;cursor:pointer;
    transition:background-color .2s,box-shadow .3s;
  }
  button:hover{background:rgba(245,166,91,.15);box-shadow:0 0 28px -10px rgba(245,166,91,.4)}
  small{display:block;margin-top:2rem;color:#6A5F5A;font-size:.85rem}
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>You're offline</h1>
    <p>Business-EOS needs a connection to show live figures — we don't keep your business data on the device.</p>
    <button onclick="location.reload()">Try again</button>
    <small>Reconnect and this page will pick up where you left off.</small>
  </div>
</body>
</html>
